{% extends "base.html" %}

{% block content %}
<main class="font-mono min-h-screen px-6 py-10 bg-[#141414] text-[#fff2d7] flex items-center justify-center">
    <div class="max-w-3xl mx-auto w-full">

        <!-- Header -->
        <header class="mb-8">
            <h1 class="text-2xl font-bold text-[#fff2d7]">
                ☕ BrewSec · CSRF (No Defenses) · Level 01
            </h1>
            <p class="text-sm text-[#a09070] mt-1">
                Update account credentials.
            </p>
        </header>

        <div class="bg-[#1e1e1e] border border-[#2e2e2e] rounded-lg p-8 hover:border-[#4a4a4a] transition-colors">
            
            <form action="{{ url_for('csrf.update_password') }}" method="POST" class="space-y-6">
                
                <!-- New Password Field -->
                <div>
                    <label for="new_password" class="block text-xs text-[#a09070] mb-2 uppercase tracking-wider">
                        New Password
                    </label>
                    <input type="password" 
                           id="new_password" 
                           name="new_password" 
                           required 
                           class="w-full bg-[#141414] border border-[#2e2e2e] rounded-md px-4 py-2.5 text-[#fff2d7] focus:outline-none focus:border-[#fff2d7] transition-colors placeholder-[#5a5040]"
                           placeholder="••••••••">
                </div>

                <!-- Confirm New Password Field -->
                <div>
                    <label for="confirm_password" class="block text-xs text-[#a09070] mb-2 uppercase tracking-wider">
                        Confirm New Password
                    </label>
                    <input type="password" 
                           id="confirm_password" 
                           name="confirm_password" 
                           required 
                           class="w-full bg-[#141414] border border-[#2e2e2e] rounded-md px-4 py-2.5 text-[#fff2d7] focus:outline-none focus:border-[#fff2d7] transition-colors placeholder-[#5a5040]"
                           placeholder="••••••••">
                </div>

                <!-- Action Buttons -->
                <div class="flex items-center justify-between pt-4">
                    <a href="{{ url_for('csrf.home') }}" 
                       class="text-sm text-[#a09070] hover:text-[#fff2d7] transition-colors">
                        ← Back to Portal
                    </a>

                    <button type="submit" 
                            class="bg-[#fff2d7] text-[#141414] font-bold rounded-md px-5 py-2 text-sm hover:bg-[#e8dcc0] transition-colors shadow-lg shadow-[#fff2d7]/10 cursor-pointer">
                        Update Password
                    </button>
                </div>
            </form>

        </div>

    </div>
</main>
{% endblock %}
