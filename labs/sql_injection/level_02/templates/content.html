{% extends "base.html" %}

{% block content %}
<main class="font-mono min-h-screen px-6 py-6 bg-[#141414] text-[#fff2d7] flex items-center justify-center">
    <div class="max-w-md mx-auto w-full">

        <!-- Header -->
        <header class="mb-5">
            <h1 class="text-xl font-bold text-[#fff2d7]">☕ BrewSec · SQL Injection (Login Bypass) · Level 02</h1>
        </header>

        <!-- Login form -->
        <form method="post" action=""
              class="bg-[#1e1e1e] border border-[#2e2e2e] rounded-lg p-4 space-y-3">

            <div>
                <label for="username" class="block text-[10px] text-[#a09070] mb-1 tracking-wide">USERNAME</label>
                <input type="text" id="username" name="username" required
                       autocomplete="username" placeholder="admin"
                       class="w-full bg-[#141414] border border-[#3a3a3a] rounded-md
                              px-3 py-1.5 text-sm text-[#fff2d7] placeholder-[#a09070]
                              focus:outline-none focus:border-[#fff2d7] focus:ring-1 focus:ring-[#fff2d7]/30
                              transition-colors">
            </div>

            <div>
                <label for="password" class="block text-[10px] text-[#a09070] mb-1 tracking-wide">PASSWORD</label>
                <input type="password" id="password" name="password" required
                       autocomplete="current-password" placeholder="••••••••"
                       class="w-full bg-[#141414] border border-[#3a3a3a] rounded-md
                              px-3 py-1.5 text-sm text-[#fff2d7] placeholder-[#a09070]
                              focus:outline-none focus:border-[#fff2d7] focus:ring-1 focus:ring-[#fff2d7]/30
                              transition-colors">
            </div>

            <button type="submit"
                    class="w-full bg-[#fff2d7] text-[#141414] font-bold rounded-md
                           px-4 py-1.5 text-sm hover:bg-[#e8dcc0] transition-colors
                           shadow-lg shadow-[#fff2d7]/10">
                Login
            </button>
        </form>

        {% if session.get('username') %}
        <p class="text-xs text-[#a09070] mt-3 text-center">
            Logged in as <span class="text-[#fff2d7]">{{ session.username }}</span>
        </p>
        {% endif %}

        <script>
            setTimeout(function() {
                const flashContainer = document.getElementById('flash-container');
                if (flashContainer) {
                    flashContainer.style.opacity = '0';
                    setTimeout(function() {
                        flashContainer.remove();
                    }, 500);
            }}, 3000);
        </script>

    </div>
</main>
{% endblock %}
