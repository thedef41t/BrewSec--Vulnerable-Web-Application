<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL Injection (LEVEL 02)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-[#141414] text-[#fff2d7] font-mono">
    <!-- Flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div id="flash-container" class="mb-3 space-y-1.5">
                {% for category, message in messages %}
                    <div class="text-xs px-3 py-2 rounded-md border
                        {% if category == 'success' %}
                            bg-[#1e2e1e] border-[#3a5a3a] text-[#b8e6b8]
                        {% else %}
                            bg-[#2e1e1e] border-[#5a3a3a] text-[#e6b8b8]
                        {% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    {% block content %}
    {% endblock %}

    <script>
        setTimeout(() => {
            const flashBox = document.getElementById('flash-messages');
            if (flashBox) {
                flashBox.style.opacity = '0';
                setTimeout(() => flashBox.remove(), 500);
            }
        }, 3000);
    </script>
</body>
</html>
